name: Summary

on:
  workflow_dispatch:


jobs: 
  summary:
    runs-on: ubuntu-latest

    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Summary
        id: summary
        run: |
          UPLOADED_FILES=()

          for directory in $(ls); do
            UPLOADED_FILES+=("$directory")
          done

          FILES_LIST=$(IFS=', '; echo "${UPLOADED_FILES[*]}")
          echo $FILES_LIST
          echo "summary=$FILES_LIST" >> "$GITHUB_OUTPUT"
  
  summary-matrix:
    needs: summary
    runs-on: ubuntu-latest
    steps:
      - name: Summary Matrix
        run: |
          {
            echo "## 🗄️ Release Summary"
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Message | hello ! |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Display Summary
        run: |
          {
            echo "Folder publication: \ `assets/translation/swb-editor/3.40\` |"
            echo "**POEditor files uploaded**: \`${{ needs.summary.outputs.summary }}\` |"
          } >> $GITHUB_STEP_SUMMARY


          